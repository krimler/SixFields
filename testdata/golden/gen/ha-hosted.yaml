apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: dev-1
  namespace: default
spec:
  topology:
    classRef:
      name: std-hosted
    controlPlane:
      replicas: 3
    variables:
    - name: size
      value: ha
    - name: placement
      value: hosted
    version: v1.34.11
    workers:
      machineDeployments:
      - class: default
        name: default
        replicas: 2
