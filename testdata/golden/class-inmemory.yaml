apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  labels:
    sixfields.io/break-glass: "true"
  name: std-kubeadm-default-bootstrap
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
          - name: eviction-hard
            value: nodefs.available<0%,nodefs.inodesFree<0%,imagefs.available<0%
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  labels:
    sixfields.io/break-glass: "true"
  name: std-inmemory
spec:
  controlPlane:
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: DevMachineTemplate
        name: std-inmemory-control-plane-machine
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KubeadmControlPlaneTemplate
      name: std-kubeadm-control-plane
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
      kind: DevClusterTemplate
      name: std-inmemory-cluster
  variables:
  - name: size
    required: true
    schema:
      openAPIV3Schema:
        default: dev
        description: dev is a single control-plane machine, ha is three.
        enum:
        - dev
        - ha
        type: string
  - name: placement
    required: true
    schema:
      openAPIV3Schema:
        default: self
        description: self runs the control plane on machines, hosted runs it as pods.
        enum:
        - self
        - hosted
        type: string
  workers:
    machineDeployments:
    - bootstrap:
        templateRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
          kind: KubeadmConfigTemplate
          name: std-kubeadm-default-bootstrap
      class: default
      infrastructure:
        templateRef:
          apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
          kind: DevMachineTemplate
          name: std-inmemory-default-machine
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlaneTemplate
metadata:
  labels:
    sixfields.io/break-glass: "true"
  name: std-kubeadm-control-plane
spec:
  template:
    spec:
      kubeadmConfigSpec:
        clusterConfiguration:
          apiServer:
            certSANs:
            - localhost
            - host.docker.internal
            - '::'
            - ::1
            - 127.0.0.1
            - 0.0.0.0
        initConfiguration:
          nodeRegistration:
            kubeletExtraArgs:
            - name: eviction-hard
              value: nodefs.available<0%,nodefs.inodesFree<0%,imagefs.available<0%
        joinConfiguration:
          nodeRegistration:
            kubeletExtraArgs:
            - name: eviction-hard
              value: nodefs.available<0%,nodefs.inodesFree<0%,imagefs.available<0%
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevClusterTemplate
metadata:
  labels:
    sixfields.io/break-glass: "true"
  name: std-inmemory-cluster
spec:
  template:
    spec:
      backend:
        inMemory: {}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevMachineTemplate
metadata:
  labels:
    sixfields.io/break-glass: "true"
  name: std-inmemory-control-plane-machine
spec:
  template:
    spec:
      backend:
        inMemory:
          apiServer:
            provisioning:
              startupDuration: 1s
              startupJitter: "0.2"
          etcd:
            provisioning:
              startupDuration: 1s
              startupJitter: "0.2"
          node:
            provisioning:
              startupDuration: 1s
              startupJitter: "0.2"
          vm:
            provisioning:
              startupDuration: 2s
              startupJitter: "0.2"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevMachineTemplate
metadata:
  labels:
    sixfields.io/break-glass: "true"
  name: std-inmemory-default-machine
spec:
  template:
    spec:
      backend:
        inMemory:
          node:
            provisioning:
              startupDuration: 1s
              startupJitter: "0.2"
          vm:
            provisioning:
              startupDuration: 2s
              startupJitter: "0.2"
