apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: K0sWorkerConfigTemplate
metadata:
  labels:
    capi-distro.io/break-glass: "true"
  name: std-default-bootstrap
spec:
  template:
    spec:
      version: v1.34.11+k0s.0
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  labels:
    capi-distro.io/break-glass: "true"
  name: std
spec:
  controlPlane:
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: DevMachineTemplate
        name: std-control-plane-machine
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta1
      kind: K0sControlPlaneTemplate
      name: std-control-plane
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
      kind: DevClusterTemplate
      name: std-cluster
  variables:
  - name: size
    required: true
    schema:
      openAPIV3Schema:
        default: dev
        description: dev is a single control-plane machine, ha is three.
        enum:
        - dev
        - ha
        type: string
  - name: placement
    required: true
    schema:
      openAPIV3Schema:
        default: self
        description: self runs the control plane on machines, hosted runs it as pods.
        enum:
        - self
        - hosted
        type: string
  workers:
    machineDeployments:
    - bootstrap:
        templateRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: K0sWorkerConfigTemplate
          name: std-default-bootstrap
      class: default
      infrastructure:
        templateRef:
          apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
          kind: DevMachineTemplate
          name: std-default-machine
      metadata:
        annotations:
          machineset.cluster.x-k8s.io/skip-preflight-checks: ControlPlaneIsStable
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: K0sControlPlaneTemplate
metadata:
  labels:
    capi-distro.io/break-glass: "true"
  name: std-control-plane
spec:
  template:
    spec:
      k0sConfigSpec:
        args:
        - --enable-worker=true
        k0s:
          apiVersion: k0s.k0sproject.io/v1beta1
          kind: ClusterConfig
          metadata:
            name: k0s
          spec:
            api:
              extraArgs:
                anonymous-auth: "true"
            telemetry:
              enabled: false
      version: v1.34.11+k0s.0
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevClusterTemplate
metadata:
  labels:
    capi-distro.io/break-glass: "true"
  name: std-cluster
spec:
  template:
    spec:
      backend:
        inMemory: {}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevMachineTemplate
metadata:
  labels:
    capi-distro.io/break-glass: "true"
  name: std-control-plane-machine
spec:
  template:
    spec:
      backend:
        inMemory:
          apiServer:
            provisioning:
              startupDuration: 1s
              startupJitter: "0.2"
          etcd:
            provisioning:
              startupDuration: 1s
              startupJitter: "0.2"
          node:
            provisioning:
              startupDuration: 1s
              startupJitter: "0.2"
          vm:
            provisioning:
              startupDuration: 2s
              startupJitter: "0.2"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevMachineTemplate
metadata:
  labels:
    capi-distro.io/break-glass: "true"
  name: std-default-machine
spec:
  template:
    spec:
      backend:
        inMemory:
          node:
            provisioning:
              startupDuration: 1s
              startupJitter: "0.2"
          vm:
            provisioning:
              startupDuration: 2s
              startupJitter: "0.2"
