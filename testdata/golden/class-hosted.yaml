apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: K0sWorkerConfigTemplate
metadata:
  labels:
    sixfields.io/break-glass: "true"
  name: std-default-bootstrap
spec:
  template:
    spec:
      version: v1.34.11+k0s.0
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  labels:
    sixfields.io/break-glass: "true"
  name: std-hosted
spec:
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta1
      kind: K0smotronControlPlaneTemplate
      name: std-hosted-control-plane
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
      kind: DevClusterTemplate
      name: std-cluster
  variables:
  - name: size
    required: true
    schema:
      openAPIV3Schema:
        default: dev
        description: dev is a single control-plane machine, ha is three.
        enum:
        - dev
        - ha
        type: string
  - name: placement
    required: true
    schema:
      openAPIV3Schema:
        default: self
        description: self runs the control plane on machines, hosted runs it as pods.
        enum:
        - self
        - hosted
        type: string
  workers:
    machineDeployments:
    - bootstrap:
        templateRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: K0sWorkerConfigTemplate
          name: std-default-bootstrap
      class: default
      infrastructure:
        templateRef:
          apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
          kind: DevMachineTemplate
          name: std-default-machine
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: K0smotronControlPlaneTemplate
metadata:
  labels:
    sixfields.io/break-glass: "true"
  name: std-hosted-control-plane
spec:
  template:
    spec:
      persistence:
        type: emptyDir
      replicas: 1
      service:
        apiPort: 30443
        konnectivityPort: 30132
        type: NodePort
      version: v1.34.11-k0s.0
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevClusterTemplate
metadata:
  labels:
    sixfields.io/break-glass: "true"
  name: std-cluster
spec:
  template:
    spec:
      backend:
        docker: {}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevMachineTemplate
metadata:
  labels:
    sixfields.io/break-glass: "true"
  name: std-control-plane-machine
spec:
  template:
    spec:
      backend:
        docker:
          customImage: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevMachineTemplate
metadata:
  labels:
    sixfields.io/break-glass: "true"
  name: std-default-machine
spec:
  template:
    spec:
      backend:
        docker:
          customImage: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
