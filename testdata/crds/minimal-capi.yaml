# Minimal CRDs for the envtest layer. They carry the group, version and names of
# the real Cluster API kinds and accept any spec, which is all the admission
# policy and the watcher need: the policy reads fields off the submitted object,
# and the watcher discovers resources through the API server's discovery
# document. The real CRDs are exercised by `make e2e`, against a live install.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusters.cluster.x-k8s.io
spec:
  group: cluster.x-k8s.io
  scope: Namespaced
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
  versions:
    - name: v1beta2
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
