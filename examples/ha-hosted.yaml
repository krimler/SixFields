---
# size and placement are the only variables a user may set; both are validated by
# the class (assembly/clusterclass/base/clusterclass.yaml). placement: hosted is
# wired in PLAN.md Phase 4 and resolves to a second class there.
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: ha-1
  namespace: default
spec:
  topology:
    classRef:
      name: std
    version: v1.34.11
    # size: ha means three control-plane nodes. It has to be written here as well
    # as in the variable: a ClusterClass patch cannot set control-plane replicas at
    # v1.14.2 (the patch engine preserves spec.replicas on the control plane), so
    # `cluster new --size ha` writes both. See DECISIONS.md.
    controlPlane:
      replicas: 3
    workers:
      machineDeployments:
      - name: default
        class: default
        replicas: 3
    variables:
    - name: size
      value: ha
    - name: placement
      value: hosted
