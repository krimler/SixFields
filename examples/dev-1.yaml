---
# spec.topology.class became spec.topology.classRef.{name,namespace} in the
# v1beta2 contract (api@v1.14.2 core/v1beta2/cluster_types.go Topology.ClassRef);
# PLAN.md still shows the v1beta1 spelling.
# The version is the one versions.env pins; TestExamples_MatchPinnedVersions fails if they drift.
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: dev-1
  namespace: default
spec:
  topology:
    classRef:
      name: std
    version: v1.34.11
    workers:
      machineDeployments:
      - name: default
        class: default
        replicas: 2
