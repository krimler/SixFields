---
# Shape read from k0smotron@v1.10.9
# api/controlplane/v1beta1/k0s_template_types.go (K0sControlPlaneTemplate ->
# spec.template.spec.{k0sConfigSpec,version}). Replicas are not set here: the
# control plane's replica count comes from Cluster.spec.topology.controlPlane,
# which the topology controller preserves (see DECISIONS.md).
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: K0sControlPlaneTemplate
metadata:
  name: std-control-plane
spec:
  template:
    spec:
      version: ${K0S_VERSION}
      k0sConfigSpec:
        args:
        # A k0s controller is not a Kubernetes node unless it also runs a worker,
        # and a Machine with no node never becomes Ready — which holds the
        # MachineSet's preflight and stops any worker being created at all. The
        # control-plane taint still keeps ordinary workloads off it.
        - --enable-worker=true
        k0s:
          apiVersion: k0s.k0sproject.io/v1beta1
          kind: ClusterConfig
          metadata:
            name: k0s
          spec:
            api:
              extraArgs:
                anonymous-auth: "true"
            telemetry:
              enabled: false
