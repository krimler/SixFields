---
# The fast substrate: same six fields, no containers. It is its own class because
# the in-memory backend simulates a kubeadm control plane, so it cannot share the
# k0s control plane the docker overlay uses.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../bootstrap/kubeadm
- clusterclass.yaml
- infrastructure.yaml

# Installing the assembly means writing kinds the policy manages (*Template). That
# is the operator break-glass case, not a hole: this label is one half, and
# hack/dev-up.sh supplies the other half by impersonating the break-glass group.
# Every install is recorded in the binding's audit annotation. See docs/eject.md.
labels:
- includeSelectors: false
  pairs:
    sixfields.io/break-glass: "true"
