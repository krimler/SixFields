---
# The documented kubeadm fallback. PLAN.md Phase 5 moves both placements to k0s so
# there is one provider family and one set of condition types to fold; this class
# stays because kubeadm is what every other Cluster API assembly uses, and a
# reader who needs it should find it here rather than reconstruct it.
#
# It is rendered and tested but not installed by `make dev-up`. Install it with:
#   kubectl apply -f bin/render/kubeadm.yaml --as ... --as-group capi-distro:break-glass
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: std-kubeadm
spec:
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
      kind: DevClusterTemplate
      name: std-cluster
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KubeadmControlPlaneTemplate
      name: std-kubeadm-control-plane
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: DevMachineTemplate
        name: std-control-plane-machine
  workers:
    machineDeployments:
    - class: default
      bootstrap:
        templateRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
          kind: KubeadmConfigTemplate
          name: std-kubeadm-default-bootstrap
      infrastructure:
        templateRef:
          apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
          kind: DevMachineTemplate
          name: std-default-machine
  variables:
  # Control-plane replicas cannot be reached by a ClusterClass patch: the
  # topology controller preserves spec.replicas on the control plane object when
  # it applies patched templates
  # (cluster-api@v1.14.2 core/reconcilers/topology/cluster/patches/patch.go:61-65,
  # engine.go:635), and KubeadmControlPlaneTemplate has no replicas field
  # (controlplane/kubeadm/v1beta2/kubeadmcontrolplanetemplate_types.go:89).
  # size is therefore consumed by the generator, which writes
  # Cluster.spec.topology.controlPlane.replicas: dev -> 1, ha -> 3.
  - name: size
    required: true
    schema:
      openAPIV3Schema:
        type: string
        enum: ["dev", "ha"]
        default: dev
        description: "dev is a single control-plane machine, ha is three."
  # A ClusterClass has exactly one controlPlane (clusterclass_types.go:114), so
  # hosted resolves to a second class in Phase 4 rather than to a patch here.
  - name: placement
    required: true
    schema:
      openAPIV3Schema:
        type: string
        enum: ["self", "hosted"]
        default: self
        description: "self runs the control plane on machines, hosted runs it as pods."
