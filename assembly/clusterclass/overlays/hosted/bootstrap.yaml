---
# Workers join a k0s control plane with a token, so they need the k0s bootstrap
# provider rather than kubeadm. This is the one place the two placements differ
# below the control plane itself.
#
# The version is the + spelling, not the - one the control plane uses: k0smotron's
# own webhook rejects the dash form here. See versions.env.
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: K0sWorkerConfigTemplate
metadata:
  name: std-hosted-default-bootstrap
spec:
  template:
    spec:
      version: ${K0S_VERSION}
