---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- infrastructure.yaml
patches:
# spec.patches is absent in the base and MinItems=1 forbids an empty list
# (api@v1.14.2 core/v1beta2/clusterclass_types.go:133), so the overlay adds the
# whole array rather than appending to it.
- target:
    group: cluster.x-k8s.io
    version: v1beta2
    kind: ClusterClass
    name: std
  patch: |-
    - op: add
      path: /spec/patches
      value:
      - name: nodeImage
        description: "Boots control-plane and worker machines from the pinned node image."
        definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: DevMachineTemplate
            matchResources:
              controlPlane: true
              machineDeploymentClass:
                names:
                - default
          jsonPatches:
          - op: add
            path: /spec/template/spec/backend/docker/customImage
            valueFrom:
              variable: nodeImage
