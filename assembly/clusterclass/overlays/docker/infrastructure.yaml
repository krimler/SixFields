---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevClusterTemplate
metadata:
  name: std-cluster
spec:
  template:
    spec:
      backend:
        docker: {}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevMachineTemplate
metadata:
  name: std-control-plane-machine
spec:
  template:
    spec:
      backend:
        # The image is an operator opinion, not a user variable. It is written here
        # rather than patched from a ClusterClass variable because CAPI's mutating
        # webhook defaults every class variable onto the Cluster, which would put
        # nodeImage into spec.topology.variables on an ordinary user's write and
        # the admission policy would reject it. hack/render.sh substitutes it from
        # WORKLOAD_NODE_IMAGE in versions.env.
        docker:
          customImage: ${WORKLOAD_NODE_IMAGE}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevMachineTemplate
metadata:
  name: std-default-machine
spec:
  template:
    spec:
      backend:
        docker:
          customImage: ${WORKLOAD_NODE_IMAGE}
