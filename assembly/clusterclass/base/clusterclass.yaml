---
# templateRef is {apiVersion,kind,name} on this release
# (api@v1.14.2 core/v1beta2/clusterclass_types.go:1559), not apiGroup.
# The Dev* templates it points at are supplied by the overlay, which is what
# selects spec.backend.docker or spec.backend.inMemory.
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: std
spec:
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
      kind: DevClusterTemplate
      name: std-cluster
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta1
      kind: K0sControlPlaneTemplate
      name: std-control-plane
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: DevMachineTemplate
        name: std-control-plane-machine
  workers:
    machineDeployments:
    - class: default
      metadata:
        annotations:
          # k0smotron's K0sControlPlane reports status.version as the k0s release
          # (v1.34.11+k0s.0) while the MachineSet carries the Kubernetes version
          # (v1.34.11). CAPI's ControlPlaneIsStable preflight compares the two as
          # strings, concludes an upgrade is permanently pending, and holds worker
          # scale-up for ever: "Scale up on hold because K0sControlPlane ... has a
          # pending version upgrade ... MachineSet version (v1.34.11) is not yet
          # the same as the ControlPlane version (v1.34.11+k0s.0)".
          #
          # The annotation name is from the pinned release
          # (api@v1.14.2 core/v1beta2/common_types.go, MachineSetSkipPreflightChecksAnnotation)
          # and only this one check is skipped; the rest still run.
          machineset.cluster.x-k8s.io/skip-preflight-checks: ControlPlaneIsStable
      bootstrap:
        templateRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: K0sWorkerConfigTemplate
          name: std-default-bootstrap
      infrastructure:
        templateRef:
          apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
          kind: DevMachineTemplate
          name: std-default-machine
  variables:
  # Control-plane replicas cannot be reached by a ClusterClass patch: the
  # topology controller preserves spec.replicas on the control plane object when
  # it applies patched templates
  # (cluster-api@v1.14.2 core/reconcilers/topology/cluster/patches/patch.go:61-65,
  # engine.go:635), and KubeadmControlPlaneTemplate has no replicas field
  # (controlplane/kubeadm/v1beta2/kubeadmcontrolplanetemplate_types.go:89).
  # size is therefore consumed by the generator, which writes
  # Cluster.spec.topology.controlPlane.replicas: dev -> 1, ha -> 3.
  - name: size
    required: true
    schema:
      openAPIV3Schema:
        type: string
        enum: ["dev", "ha"]
        default: dev
        description: "dev is a single control-plane machine, ha is three."
  # A ClusterClass has exactly one controlPlane (clusterclass_types.go:114), so
  # hosted resolves to a second class in Phase 4 rather than to a patch here.
  - name: placement
    required: true
    schema:
      openAPIV3Schema:
        type: string
        enum: ["self", "hosted"]
        default: self
        description: "self runs the control plane on machines, hosted runs it as pods."
